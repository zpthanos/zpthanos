<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">How I help teams</title><desc id="desc">Four plain-language service areas for customer support, incidents, releases and delivery.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#0b1d31"/><stop offset="1" stop-color="#111827"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/></filter></defs><rect width="1200" height="430" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="428" rx="25" fill="none" stroke="#a78bfa" stroke-opacity="0.30" stroke-width="2"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="42" y="48" fill="#a78bfa" font-size="13" font-weight="800" letter-spacing="1.8">HOW I HELP TEAMS</text><text x="42" y="85" fill="#f8fafc" font-size="29" font-weight="900">Clear support from first report to verified handover</text><text x="42" y="113" fill="#cbd5e1" font-size="15">Four outcomes a customer-facing technical team can rely on.</text><g filter="url(#shadow)"><rect x="42" y="145" width="535" height="115" rx="18" fill="#0b1d31" stroke="#38bdf8" stroke-opacity="0.45"/></g><rect x="62" y="167" width="42" height="42" rx="12" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.45"/><text x="83" y="194" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="900">01</text><text x="120" y="184" fill="#f8fafc" font-size="18" font-weight="800">Reliable store support</text><text x="120" y="213" fill="#cbd5e1" font-size="13.5">Questions, configuration and checkout issues become clear</text><text x="120" y="235" fill="#cbd5e1" font-size="13.5">answers and verified fixes.</text><g filter="url(#shadow)"><rect x="623" y="145" width="535" height="115" rx="18" fill="#0b1d31" stroke="#fb7185" stroke-opacity="0.45"/></g><rect x="643" y="167" width="42" height="42" rx="12" fill="#fb7185" fill-opacity="0.15" stroke="#fb7185" stroke-opacity="0.45"/><text x="664" y="194" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="900">02</text><text x="701" y="184" fill="#f8fafc" font-size="18" font-weight="800">Calm incident response</text><text x="701" y="213" fill="#cbd5e1" font-size="13.5">Problems are reproduced, narrowed down and resolved through a</text><text x="701" y="235" fill="#cbd5e1" font-size="13.5">controlled recovery path.</text><g filter="url(#shadow)"><rect x="42" y="282" width="535" height="115" rx="18" fill="#0b1d31" stroke="#2dd4bf" stroke-opacity="0.45"/></g><rect x="62" y="304" width="42" height="42" rx="12" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="83" y="331" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="900">03</text><text x="120" y="321" fill="#f8fafc" font-size="18" font-weight="800">Confidence before release</text><text x="120" y="350" fill="#cbd5e1" font-size="13.5">Important journeys, browsers and accessibility are checked with</text><text x="120" y="372" fill="#cbd5e1" font-size="13.5">visible evidence.</text><g filter="url(#shadow)"><rect x="623" y="282" width="535" height="115" rx="18" fill="#0b1d31" stroke="#a78bfa" stroke-opacity="0.45"/></g><rect x="643" y="304" width="42" height="42" rx="12" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.45"/><text x="664" y="331" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="900">04</text><text x="701" y="321" fill="#f8fafc" font-size="18" font-weight="800">Shared delivery clarity</text><text x="701" y="350" fill="#cbd5e1" font-size="13.5">Technical and non-technical people understand the plan,</text><text x="701" y="372" fill="#cbd5e1" font-size="13.5">progress and next action.</text></g></svg>