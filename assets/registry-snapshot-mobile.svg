<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-label="Searchable evidence routes for customer support, customer success and technical account ownership">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="704" height="594" rx="24" fill="url(#bg)" stroke="#1E3A5F" stroke-width="2"/>
  <rect x="30" y="28" width="196" height="36" rx="18" fill="#20B8A6"/>
  <text x="128" y="52" text-anchor="middle" fill="#031711" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">SEARCHABLE EVIDENCE</text>

  <text x="30" y="108" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Start with the problem.</text>
  <text x="30" y="141" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">The registry finds the proof.</text>
  <text x="30" y="176" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="14">Search a situation, responsibility, technology or symptom.</text>

  <rect x="30" y="206" width="660" height="104" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="235" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">CUSTOMER ISSUE</text>
  <text x="50" y="264" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Own it through closure</text>
  <text x="50" y="289" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Reproduce · investigate · escalate · verify</text>

  <rect x="30" y="326" width="660" height="104" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="355" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">ADOPTION &amp; SUCCESS</text>
  <text x="50" y="384" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Help customers operate confidently</text>
  <text x="50" y="409" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Onboard · train · recover trust · improve guidance</text>

  <rect x="30" y="446" width="660" height="104" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="475" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">TECHNICAL ACCOUNT</text>
  <text x="50" y="504" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Keep the relationship moving</text>
  <text x="50" y="529" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Clarify · coordinate · communicate · follow through</text>

  <text x="30" y="582" fill="#2F8FBE" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">SEARCH → RANK → INSPECT THE STRONGEST EVIDENCE</text>
</svg>