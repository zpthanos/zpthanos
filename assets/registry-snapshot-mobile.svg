<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-label="Customer story finder for relationship recovery, ambiguous requests and proactive account value">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="704" height="594" rx="24" fill="url(#bg)" stroke="#1E3A5F" stroke-width="2"/>
  <rect x="30" y="28" width="196" height="36" rx="18" fill="#20B8A6"/>
  <text x="128" y="52" text-anchor="middle" fill="#031711" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">CUSTOMER STORIES</text>

  <text x="30" y="108" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Start with the customer situation.</text>
  <text x="30" y="141" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Inspect the real case.</text>
  <text x="30" y="176" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="14">21 first-hand production stories across customer and delivery work.</text>

  <rect x="30" y="206" width="660" height="104" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="235" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">CUSTOMER IS UNHAPPY</text>
  <text x="50" y="264" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Recover trust and reset expectations</text>
  <text x="50" y="289" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Listen · clarify · coordinate · validate</text>

  <rect x="30" y="326" width="660" height="104" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="355" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">REQUEST IS VAGUE</text>
  <text x="50" y="384" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Turn ambiguity into requirements</text>
  <text x="50" y="409" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Discover · research · recommend · review</text>

  <rect x="30" y="446" width="660" height="104" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="475" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">VALUE OPPORTUNITY</text>
  <text x="50" y="504" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Go beyond the original brief</text>
  <text x="50" y="529" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Identify need · propose value · deliver · verify</text>

  <text x="30" y="582" fill="#2F8FBE" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">PICK A SITUATION → SEE THE STRONGEST FIRST-HAND EVIDENCE</text>
</svg>
