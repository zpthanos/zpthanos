<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 315" role="img" aria-labelledby="title desc"><title id="title">Results from real work</title><desc id="desc">Three memorable customer-facing outcomes from WordPress and WooCommerce delivery.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#0b1d31"/><stop offset="1" stop-color="#111827"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/></filter></defs><rect width="1200" height="315" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="313" rx="25" fill="none" stroke="#2dd4bf" stroke-opacity="0.30" stroke-width="2"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="42" y="48" fill="#2dd4bf" font-size="13" font-weight="800" letter-spacing="1.8">RESULTS FROM REAL WORK</text><text x="42" y="85" fill="#f8fafc" font-size="29" font-weight="900">Three outcomes worth remembering</text><text x="42" y="113" fill="#cbd5e1" font-size="15">Each result is backed by a full situation, action and verification story.</text><g filter="url(#shadow)"><rect x="42" y="140" width="350" height="140" rx="18" fill="#0b1d31" stroke="#38bdf8" stroke-opacity="0.5"/></g><text x="66" y="188" fill="#38bdf8" font-size="28" font-weight="900">RECOVERED</text><text x="66" y="219" fill="#f8fafc" font-size="17" font-weight="800">Store safely relaunched</text><text x="66" y="248" fill="#cbd5e1" font-size="13">Verified backups, rotated credentials, then</text><text x="66" y="270" fill="#cbd5e1" font-size="13">tested catalogue, cart and checkout.</text><g filter="url(#shadow)"><rect x="425" y="140" width="350" height="140" rx="18" fill="#0b1d31" stroke="#2dd4bf" stroke-opacity="0.5"/></g><text x="449" y="188" fill="#2dd4bf" font-size="28" font-weight="900">20 → 75+</text><text x="449" y="219" fill="#f8fafc" font-size="17" font-weight="800">PageSpeed improved</text><text x="449" y="248" fill="#cbd5e1" font-size="13">Performance increased without breaking the</text><text x="449" y="270" fill="#cbd5e1" font-size="13">customer buying journey.</text><g filter="url(#shadow)"><rect x="808" y="140" width="350" height="140" rx="18" fill="#0b1d31" stroke="#a78bfa" stroke-opacity="0.5"/></g><text x="832" y="188" fill="#a78bfa" font-size="28" font-weight="900">2,000+</text><text x="832" y="219" fill="#f8fafc" font-size="17" font-weight="800">Products made manageable</text><text x="832" y="248" fill="#cbd5e1" font-size="13">Repeatable workflows helped a non-technical</text><text x="832" y="270" fill="#cbd5e1" font-size="13">owner work independently.</text></g></svg>