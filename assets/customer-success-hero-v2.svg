  <text x="54" y="130" fill="#f8fafc" font-size="57" font-weight="900">Customer Success &amp;</text>
  <text x="54" y="191" fill="#f8fafc" font-size="57" font-weight="900">Technical Support</text>
  <text x="54" y="238" fill="#cbd5e1" font-size="24" font-weight="650">Onboarding · Tickets · Risk · Enablement · Documentation</text>
  <rect x="54" y="263" width="650" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="54" y="310" fill="#a5b4c8" font-size="22" font-weight="650">Helping customers adopt and operate technical products.</text>
  <text x="54" y="344" fill="#a5b4c8" font-size="22" font-weight="650">Focused on value, trust and clear follow-through.</text>
  <text x="54" y="382" fill="#94a3b8" font-size="20" font-weight="650">Remote from Greece · EMEA · English &amp; Greek</text>

  <g transform="translate(760 42)">
