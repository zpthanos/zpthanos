<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Athanasios Zaprios — Customer Success and Technical Support</title>
<desc id="desc">Customer success and technical support profile highlighting 60 plus supported production sites, 30 customer engagements, 12 WooCommerce stores and more than three years of customer-facing delivery.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b2036"/><stop offset="1" stop-color="#18213c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.52" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity="0.035"/></pattern>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.24" stroke-width="2"/>
<circle cx="1030" cy="105" r="260" fill="url(#glow)"/>
<g font-family="Segoe UI, Arial, sans-serif">
