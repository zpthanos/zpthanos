    <g transform="translate(20 66)"><rect width="168" height="108" rx="17" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="48" fill="#f8fafc" font-size="37" font-weight="900">60+</text><text x="20" y="82" fill="#cbd5e1" font-size="18" font-weight="800">SITES SUPPORTED</text></g>
    <g transform="translate(204 66)"><rect width="168" height="108" rx="17" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="48" fill="#f8fafc" font-size="37" font-weight="900">30</text><text x="20" y="78" fill="#cbd5e1" font-size="17" font-weight="800">CUSTOMER</text><text x="20" y="99" fill="#cbd5e1" font-size="17" font-weight="800">ENGAGEMENTS</text></g>
    <g transform="translate(20 192)"><rect width="168" height="108" rx="17" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="48" fill="#f8fafc" font-size="37" font-weight="900">12</text><text x="20" y="82" fill="#cbd5e1" font-size="18" font-weight="800">WOO STORES</text></g>
    <g transform="translate(204 192)"><rect width="168" height="108" rx="17" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="48" fill="#f8fafc" font-size="37" font-weight="900">3+ YEARS</text><text x="20" y="78" fill="#cbd5e1" font-size="17" font-weight="800">CUSTOMER-</text><text x="20" y="99" fill="#cbd5e1" font-size="17" font-weight="800">FACING</text></g>
