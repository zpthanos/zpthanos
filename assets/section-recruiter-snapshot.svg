<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" role="img" aria-labelledby="title description">
  <title id="title">Recruiter snapshot</title>
  <desc id="description">A rounded professional section title panel in cyan and teal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1d31"/>
      <stop offset="1" stop-color="#08243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="90" rx="18" fill="url(#background)" stroke="#38bdf8" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="1040" cy="46" r="210" fill="url(#glow)"/>
  <rect x="0" y="0" width="9" height="92" rx="4.5" fill="url(#accent)"/>
  <circle cx="49" cy="46" r="12" fill="#08243a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="49" cy="46" r="4" fill="#2dd4bf"/>
  <text x="82" y="55" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="750" letter-spacing="0.2">Recruiter snapshot</text>
  <rect x="944" y="34" width="150" height="24" rx="12" fill="#08243a" stroke="#2dd4bf" stroke-opacity="0.62"/>
  <text x="1019" y="50" text-anchor="middle" fill="#99f6e4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">QUICK SCAN</text>
</svg>
