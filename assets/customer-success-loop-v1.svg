<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Customer success operating model</title>
<desc id="desc">Understand customer objectives, resolve obstacles, enable adoption, protect customer outcomes and improve through documentation and feedback.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
</defs>
<rect width="1200" height="280" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="278" rx="23" fill="none" stroke="#334155"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
  <text x="44" y="48" fill="#7dd3fc" font-size="20" font-weight="800" letter-spacing="1.8">HOW I MOVE CUSTOMERS TOWARD SUCCESS</text>
  <line x1="106" y1="126" x2="1094" y2="126" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g text-anchor="middle">
    <circle cx="110" cy="126" r="28" fill="#0f2a43" stroke="#38bdf8" stroke-width="4"/>
    <text x="110" y="136" fill="#f8fafc" font-size="28" font-weight="900">1</text>
    <text x="110" y="187" fill="#f8fafc" font-size="25" font-weight="900">UNDERSTAND</text>
    <text x="110" y="221" fill="#cbd5e1" font-size="20" font-weight="600">Clarify objectives</text>

    <circle cx="355" cy="126" r="28" fill="#0f2a43" stroke="#22c7d6" stroke-width="4"/>
    <text x="355" y="136" fill="#f8fafc" font-size="28" font-weight="900">2</text>
    <text x="355" y="187" fill="#f8fafc" font-size="25" font-weight="900">RESOLVE</text>
    <text x="355" y="221" fill="#cbd5e1" font-size="20" font-weight="600">Remove obstacles</text>

    <circle cx="600" cy="126" r="28" fill="#0f2a43" stroke="#2dd4bf" stroke-width="4"/>
    <text x="600" y="136" fill="#f8fafc" font-size="28" font-weight="900">3</text>
    <text x="600" y="187" fill="#f8fafc" font-size="25" font-weight="900">ENABLE</text>
    <text x="600" y="221" fill="#cbd5e1" font-size="20" font-weight="600">Support adoption</text>

    <circle cx="845" cy="126" r="28" fill="#0f2a43" stroke="#818cf8" stroke-width="4"/>
    <text x="845" y="136" fill="#f8fafc" font-size="28" font-weight="900">4</text>
    <text x="845" y="187" fill="#f8fafc" font-size="25" font-weight="900">PROTECT</text>
    <text x="845" y="221" fill="#cbd5e1" font-size="20" font-weight="600">Identify risk early</text>

    <circle cx="1090" cy="126" r="28" fill="#0f2a43" stroke="#a78bfa" stroke-width="4"/>
    <text x="1090" y="136" fill="#f8fafc" font-size="28" font-weight="900">5</text>
    <text x="1090" y="187" fill="#f8fafc" font-size="25" font-weight="900">IMPROVE</text>
    <text x="1090" y="221" fill="#cbd5e1" font-size="20" font-weight="600">Document &amp; learn</text>
  </g>
</g>
</svg>