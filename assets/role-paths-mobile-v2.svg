<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" role="img" aria-labelledby="title desc"><title id="title">Choose the proof that matches the role</title><desc id="desc">Mobile recruiter routes to the most relevant portfolio evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#0b1d31"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.52" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/></filter></defs><rect width="720" height="690" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="718" height="688" rx="25" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="30" y="46" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="1.7">QUICK RECRUITER ROUTES</text><text x="30" y="84" fill="#f8fafc" font-size="29" font-weight="900">Choose the proof for the role</text><text x="30" y="112" fill="#cbd5e1" font-size="14">Start with the evidence closest to the job.</text><rect x="30" y="140" width="660" height="115" rx="18" fill="#0b1d31" stroke="#38bdf8" stroke-opacity="0.45"/><circle cx="72" cy="182" r="20" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/><text x="72" y="188" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="900">01</text><text x="112" y="179" fill="#f8fafc" font-size="18" font-weight="800">Customer or application support</text><text x="112" y="212" fill="#cbd5e1" font-size="14">Real incidents, clear updates and safe follow-through.</text><rect x="30" y="275" width="660" height="115" rx="18" fill="#0b1d31" stroke="#2dd4bf" stroke-opacity="0.45"/><circle cx="72" cy="317" r="20" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-opacity="0.5"/><text x="72" y="323" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="900">02</text><text x="112" y="314" fill="#f8fafc" font-size="18" font-weight="800">WordPress or WooCommerce support</text><text x="112" y="347" fill="#cbd5e1" font-size="14">A complete shopping journey tested before a real order.</text><rect x="30" y="410" width="660" height="115" rx="18" fill="#0b1d31" stroke="#a78bfa" stroke-opacity="0.45"/><circle cx="72" cy="452" r="20" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/><text x="72" y="458" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="900">03</text><text x="112" y="449" fill="#f8fafc" font-size="18" font-weight="800">QA or release coordination</text><text x="112" y="482" fill="#cbd5e1" font-size="14">Browser, accessibility and release evidence people can review.</text><rect x="30" y="545" width="660" height="115" rx="18" fill="#0b1d31" stroke="#f59e0b" stroke-opacity="0.45"/><circle cx="72" cy="587" r="20" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/><text x="72" y="593" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="900">04</text><text x="112" y="584" fill="#f8fafc" font-size="18" font-weight="800">Solutions or implementation</text><text x="112" y="617" fill="#cbd5e1" font-size="14">Unclear requirements turned into a testable delivery plan.</text></g></svg>