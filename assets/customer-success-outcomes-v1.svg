<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Three customer success outcomes</title>
<desc id="desc">Trust restored through secure recovery, adoption enabled through onboarding, and measurable value delivered through performance improvement.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
<rect width="1200" height="340" rx="24" fill="#07111f"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
  <g transform="translate(20 20)">
    <rect width="370" height="300" rx="22" fill="url(#bg)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
    <text x="26" y="42" fill="#38bdf8" font-size="18" font-weight="800" letter-spacing="1.4">RECOVERY &amp; TRUST</text>
    <text x="26" y="100" fill="#f8fafc" font-size="42" font-weight="900">SAFELY</text>
    <text x="26" y="146" fill="#f8fafc" font-size="42" font-weight="900">RELAUNCHED</text>
    <text x="26" y="194" fill="#cbd5e1" font-size="21" font-weight="600">Recovered a compromised store,</text>
    <text x="26" y="226" fill="#cbd5e1" font-size="21" font-weight="600">rotated credentials and verified</text>
    <text x="26" y="258" fill="#cbd5e1" font-size="21" font-weight="600">catalogue, cart and checkout.</text>
  </g>
  <g transform="translate(415 20)">
    <rect width="370" height="300" rx="22" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2"/>
    <text x="26" y="42" fill="#2dd4bf" font-size="18" font-weight="800" letter-spacing="1.4">ONBOARDING &amp; ADOPTION</text>
    <text x="26" y="112" fill="#f8fafc" font-size="48" font-weight="900">2,000+</text>
    <text x="26" y="155" fill="#f8fafc" font-size="31" font-weight="900">PRODUCTS ENABLED</text>
    <text x="26" y="203" fill="#cbd5e1" font-size="21" font-weight="600">Configured core workflows and</text>
    <text x="26" y="235" fill="#cbd5e1" font-size="21" font-weight="600">trained the owner to manage</text>
    <text x="26" y="267" fill="#cbd5e1" font-size="21" font-weight="600">routine work independently.</text>
  </g>
  <g transform="translate(810 20)">
    <rect width="370" height="300" rx="22" fill="url(#bg)" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2"/>
    <text x="26" y="42" fill="#a78bfa" font-size="18" font-weight="800" letter-spacing="1.4">RELIABILITY &amp; VALUE</text>
    <text x="26" y="112" fill="#f8fafc" font-size="48" font-weight="900">&lt;20 → 75+</text>
    <text x="26" y="155" fill="#f8fafc" font-size="31" font-weight="900">PAGESPEED</text>
    <text x="26" y="203" fill="#cbd5e1" font-size="21" font-weight="600">Improved performance while</text>
    <text x="26" y="235" fill="#cbd5e1" font-size="21" font-weight="600">protecting catalogue, cart and</text>
    <text x="26" y="267" fill="#cbd5e1" font-size="21" font-weight="600">checkout behaviour.</text>
  </g>
</g>
</svg>