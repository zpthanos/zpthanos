<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Technical toolkit used across support, troubleshooting, integrations, QA, ecommerce, infrastructure and security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="1184" height="414" rx="24" fill="url(#bg)" stroke="#1E3A5F" stroke-width="2"/>
  <rect x="34" y="28" width="170" height="34" rx="17" fill="#20B8A6"/>
  <text x="119" y="51" text-anchor="middle" fill="#031711" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">PRACTICAL TOOLKIT</text>
  <text x="34" y="101" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">The tools I reach for when the problem needs evidence.</text>
  <text x="34" y="130" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="15">Grouped by how they are used, not by how impressive they look in a badge wall.</text>

  <rect x="34" y="160" width="350" height="105" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="54" y="187" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">SUPPORT &amp; ACCOUNT OPS</text>
  <text x="54" y="216" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Own, coordinate, explain</text>
  <text x="54" y="241" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">Jira · escalation · onboarding · docs · training</text>

  <rect x="425" y="160" width="350" height="105" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="445" y="187" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">TROUBLESHOOTING</text>
  <text x="445" y="216" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Observe before guessing</text>
  <text x="445" y="241" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">DevTools · logs · HTTP/S · TLS · DNS · Wireshark</text>

  <rect x="816" y="160" width="350" height="105" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="836" y="187" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">APIS &amp; INTEGRATIONS</text>
  <text x="836" y="216" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Make the request reproducible</text>
  <text x="836" y="241" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">REST · webhooks · JSON · XML · request / response</text>

  <rect x="34" y="282" width="350" height="105" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="54" y="309" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">QA &amp; RELEASE</text>
  <text x="54" y="338" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Verify the customer journey</text>
  <text x="54" y="363" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">Playwright · BrowserStack · regression · accessibility</text>

  <rect x="425" y="282" width="350" height="105" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="445" y="309" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEB &amp; ECOMMERCE</text>
  <text x="445" y="338" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Understand the application</text>
  <text x="445" y="363" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">WordPress · WooCommerce · PHP · JS · MySQL · caching</text>

  <rect x="816" y="282" width="350" height="105" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="836" y="309" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">INFRASTRUCTURE &amp; SECURITY</text>
  <text x="836" y="338" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Control change and risk</text>
  <text x="836" y="363" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">Cloudflare · WAF · CDN · cPanel · Plesk · Redis</text>

  <text x="34" y="410" fill="#2F8FBE" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".8">TOOLS SUPPORT THE INVESTIGATION. THE EVIDENCE DRIVES THE DECISION.</text>
</svg>