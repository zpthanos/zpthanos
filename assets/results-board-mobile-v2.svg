<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">Results from real work</title><desc id="desc">Mobile view of three memorable customer-facing outcomes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#0b1d31"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="720" height="650" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="718" height="648" rx="25" fill="none" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="2"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="30" y="46" fill="#2dd4bf" font-size="13" font-weight="800" letter-spacing="1.7">RESULTS FROM REAL WORK</text><text x="30" y="84" fill="#f8fafc" font-size="29" font-weight="900">Three outcomes worth remembering</text><text x="30" y="112" fill="#cbd5e1" font-size="14">Each result has a full evidence story.</text><rect x="30" y="140" width="660" height="140" rx="18" fill="#0b1d31" stroke="#38bdf8" stroke-opacity="0.5"/><text x="54" y="188" fill="#38bdf8" font-size="28" font-weight="900">RECOVERED</text><text x="54" y="222" fill="#f8fafc" font-size="18" font-weight="800">Store safely relaunched</text><text x="54" y="254" fill="#cbd5e1" font-size="14">Verified backups, rotated credentials and tested checkout.</text><rect x="30" y="300" width="660" height="140" rx="18" fill="#0b1d31" stroke="#2dd4bf" stroke-opacity="0.5"/><text x="54" y="348" fill="#2dd4bf" font-size="28" font-weight="900">20 → 75+</text><text x="54" y="382" fill="#f8fafc" font-size="18" font-weight="800">PageSpeed improved</text><text x="54" y="414" fill="#cbd5e1" font-size="14">Performance increased without breaking the buying journey.</text><rect x="30" y="460" width="660" height="140" rx="18" fill="#0b1d31" stroke="#a78bfa" stroke-opacity="0.5"/><text x="54" y="508" fill="#a78bfa" font-size="28" font-weight="900">2,000+</text><text x="54" y="542" fill="#f8fafc" font-size="18" font-weight="800">Products made manageable</text><text x="54" y="574" fill="#cbd5e1" font-size="14">Repeatable workflows helped the owner work independently.</text></g></svg>