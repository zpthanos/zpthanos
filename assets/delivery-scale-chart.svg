<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Delivery scale</title>
  <desc id="description">Horizontal bar chart showing 60 or more websites overall, 30 customer engagements, 18 cross-team collaborations, and 12 full development cycles handled across 2.5 years.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.55" stop-color="#0a1d31"/>
      <stop offset="1" stop-color="#10162b"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="barD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" rx="28" fill="url(#background)"/>
  <circle cx="95" cy="60" r="245" fill="url(#glowA)"/>
  <circle cx="1120" cy="440" r="300" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="62" fill="#f8fafc" font-size="31" font-weight="750">Delivery scale</text>
    <text x="58" y="92" fill="#94a3b8" font-size="16">Experience and delivery counts at a glance</text>

    <g transform="translate(908 30)">
      <rect width="234" height="82" rx="16" fill="#0b1728" stroke="#2dd4bf" stroke-opacity="0.48"/>
      <text x="20" y="39" fill="#f8fafc" font-size="29" font-weight="800">2.5 YEARS</text>
      <text x="20" y="63" fill="#99f6e4" font-size="11" font-weight="700" letter-spacing="1.6">WEB DELIVERY EXPERIENCE</text>
    </g>

    <g stroke="#334155" stroke-opacity="0.4" stroke-width="1">
      <line x1="350" y1="132" x2="350" y2="440"/>
      <line x1="530" y1="132" x2="530" y2="440"/>
      <line x1="710" y1="132" x2="710" y2="440"/>
      <line x1="890" y1="132" x2="890" y2="440"/>
      <line x1="1070" y1="132" x2="1070" y2="440"/>
    </g>
    <g fill="#64748b" font-size="12" font-weight="650" text-anchor="middle">
      <text x="350" y="128">0</text>
      <text x="530" y="128">15</text>
      <text x="710" y="128">30</text>
      <text x="890" y="128">45</text>
      <text x="1070" y="128">60</text>
    </g>

    <g>
      <text x="58" y="184" fill="#e2e8f0" font-size="18" font-weight="650">Websites overall</text>
      <rect x="350" y="162" width="720" height="30" rx="15" fill="#0b1728" stroke="#1e3a5f"/>
      <rect x="350" y="162" width="720" height="30" rx="15" fill="url(#barA)">
        <animate attributeName="width" from="0" to="720" dur="0.8s" fill="freeze"/>
      </rect>
      <text x="1090" y="184" fill="#7dd3fc" font-size="19" font-weight="800">60+</text>
    </g>

    <g>
      <text x="58" y="254" fill="#e2e8f0" font-size="18" font-weight="650">Customer engagements</text>
      <rect x="350" y="232" width="720" height="30" rx="15" fill="#0b1728" stroke="#1e3a5f"/>
      <rect x="350" y="232" width="360" height="30" rx="15" fill="url(#barB)">
        <animate attributeName="width" from="0" to="360" dur="0.7s" begin="0.08s" fill="freeze"/>
      </rect>
      <text x="730" y="254" fill="#99f6e4" font-size="19" font-weight="800">30</text>
    </g>

    <g>
      <text x="58" y="324" fill="#e2e8f0" font-size="18" font-weight="650">Cross-team collaborations</text>
      <rect x="350" y="302" width="720" height="30" rx="15" fill="#0b1728" stroke="#1e3a5f"/>
      <rect x="350" y="302" width="216" height="30" rx="15" fill="url(#barC)">
        <animate attributeName="width" from="0" to="216" dur="0.62s" begin="0.16s" fill="freeze"/>
      </rect>
      <text x="586" y="324" fill="#c7d2fe" font-size="19" font-weight="800">18</text>
    </g>

    <g>
      <text x="58" y="394" fill="#e2e8f0" font-size="18" font-weight="650">Full-cycle deliveries handled</text>
      <rect x="350" y="372" width="720" height="30" rx="15" fill="#0b1728" stroke="#1e3a5f"/>
      <rect x="350" y="372" width="144" height="30" rx="15" fill="url(#barD)">
        <animate attributeName="width" from="0" to="144" dur="0.54s" begin="0.24s" fill="freeze"/>
      </rect>
      <text x="514" y="394" fill="#ddd6fe" font-size="19" font-weight="800">12</text>
    </g>

    <text x="350" y="464" fill="#64748b" font-size="12" font-weight="650" letter-spacing="1.2">COUNT</text>
  </g>
</svg>
