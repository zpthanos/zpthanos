<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Customer support and product delivery scale</title>
  <desc id="description">Horizontal bar chart showing 60 production WordPress sites, 30 end-to-end client engagements, and 12 WooCommerce stores, plus a delivery lifecycle from requirements through launch, training, and handover.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b16"/><stop offset="0.55" stop-color="#0a1d31"/><stop offset="1" stop-color="#10162b"/></linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#background)"/>
  <circle cx="95" cy="60" r="245" fill="url(#glowA)"/><circle cx="1120" cy="440" r="300" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="58" fill="#f8fafc" font-size="30" font-weight="750">Customer support &amp; product delivery scale</text>
    <text x="58" y="88" fill="#94a3b8" font-size="16">Production ownership, ecommerce support, and client-facing delivery</text>
    <g stroke="#334155" stroke-opacity="0.4"><line x1="350" y1="122" x2="350" y2="360"/><line x1="530" y1="122" x2="530" y2="360"/><line x1="710" y1="122" x2="710" y2="360"/><line x1="890" y1="122" x2="890" y2="360"/><line x1="1070" y1="122" x2="1070" y2="360"/></g>
    <g fill="#64748b" font-size="12" font-weight="650" text-anchor="middle"><text x="350" y="118">0</text><text x="530" y="118">15</text><text x="710" y="118">30</text><text x="890" y="118">45</text><text x="1070" y="118">60</text></g>
    <g><text x="58" y="176" fill="#e2e8f0" font-size="18" font-weight="650">Production WordPress sites</text><rect x="350" y="154" width="720" height="30" rx="15" fill="#0b1728" stroke="#1e3a5f"/><rect x="350" y="154" width="720" height="30" rx="15" fill="url(#barA)"><animate attributeName="width" from="0" to="720" dur="0.8s" fill="freeze"/></rect><text x="1090" y="176" fill="#7dd3fc" font-size="19" font-weight="800">60</text></g>
    <g><text x="58" y="246" fill="#e2e8f0" font-size="18" font-weight="650">End-to-end client engagements</text><rect x="350" y="224" width="720" height="30" rx="15" fill="#0b1728" stroke="#1e3a5f"/><rect x="350" y="224" width="360" height="30" rx="15" fill="url(#barB)"><animate attributeName="width" from="0" to="360" dur="0.7s" begin="0.08s" fill="freeze"/></rect><text x="730" y="246" fill="#99f6e4" font-size="19" font-weight="800">30</text></g>
    <g><text x="58" y="316" fill="#e2e8f0" font-size="18" font-weight="650">WooCommerce stores</text><rect x="350" y="294" width="720" height="30" rx="15" fill="#0b1728" stroke="#1e3a5f"/><rect x="350" y="294" width="144" height="30" rx="15" fill="url(#barC)"><animate attributeName="width" from="0" to="144" dur="0.58s" begin="0.16s" fill="freeze"/></rect><text x="514" y="316" fill="#ddd6fe" font-size="19" font-weight="800">12</text></g>
    <text x="58" y="385" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">CLIENT DELIVERY LIFECYCLE</text>
    <g transform="translate(58 402)">
      <rect width="1084" height="54" rx="14" fill="#0b1728" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <g fill="#e2e8f0" font-size="14" font-weight="650" text-anchor="middle"><text x="92" y="33">Requirements</text><text x="310" y="33">Solution &amp; demo</text><text x="535" y="33">Build &amp; QA</text><text x="752" y="33">Launch</text><text x="965" y="33">Training &amp; handover</text></g>
      <g fill="#2dd4bf" font-size="18"><text x="194" y="34">→</text><text x="417" y="34">→</text><text x="646" y="34">→</text><text x="849" y="34">→</text></g>
    </g>
  </g>
</svg>