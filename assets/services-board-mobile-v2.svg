<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" role="img" aria-labelledby="title desc"><title id="title">How I help teams</title><desc id="desc">Mobile view of four support outcomes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#0b1d31"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><rect width="720" height="690" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="718" height="688" rx="25" fill="none" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="2"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="30" y="46" fill="#a78bfa" font-size="13" font-weight="800" letter-spacing="1.7">HOW I HELP TEAMS</text><text x="30" y="84" fill="#f8fafc" font-size="28" font-weight="900">From first report to verified handover</text><text x="30" y="112" fill="#cbd5e1" font-size="14">Four outcomes a customer-facing team can rely on.</text><rect x="30" y="140" width="660" height="115" rx="18" fill="#0b1d31" stroke="#38bdf8" stroke-opacity="0.45"/><rect x="50" y="162" width="44" height="44" rx="12" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.45"/><text x="72" y="190" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="900">01</text><text x="114" y="180" fill="#f8fafc" font-size="18" font-weight="800">Reliable store support</text><text x="114" y="214" fill="#cbd5e1" font-size="14">Questions and checkout issues become clear answers and verified fixes.</text><rect x="30" y="275" width="660" height="115" rx="18" fill="#0b1d31" stroke="#fb7185" stroke-opacity="0.45"/><rect x="50" y="297" width="44" height="44" rx="12" fill="#fb7185" fill-opacity="0.15" stroke="#fb7185" stroke-opacity="0.45"/><text x="72" y="325" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="900">02</text><text x="114" y="315" fill="#f8fafc" font-size="18" font-weight="800">Calm incident response</text><text x="114" y="349" fill="#cbd5e1" font-size="14">Problems are narrowed down and handled through a controlled recovery path.</text><rect x="30" y="410" width="660" height="115" rx="18" fill="#0b1d31" stroke="#2dd4bf" stroke-opacity="0.45"/><rect x="50" y="432" width="44" height="44" rx="12" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="72" y="460" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="900">03</text><text x="114" y="450" fill="#f8fafc" font-size="18" font-weight="800">Confidence before release</text><text x="114" y="484" fill="#cbd5e1" font-size="14">Important journeys, browsers and accessibility are checked with evidence.</text><rect x="30" y="545" width="660" height="115" rx="18" fill="#0b1d31" stroke="#a78bfa" stroke-opacity="0.45"/><rect x="50" y="567" width="44" height="44" rx="12" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.45"/><text x="72" y="595" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="900">04</text><text x="114" y="585" fill="#f8fafc" font-size="18" font-weight="800">Shared delivery clarity</text><text x="114" y="619" fill="#cbd5e1" font-size="14">Everyone understands the plan, progress and next action.</text></g></svg>