<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" role="img" aria-labelledby="title description">
  <title id="title">Thanos — Web Application Support and QA Engineer</title>
  <desc id="description">Mobile profile banner highlighting production support, quality assurance, and web operations experience.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.52" stop-color="#0a1d31"/>
      <stop offset="1" stop-color="#10162b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#7dd3fc" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="720" height="860" rx="28" fill="url(#background)"/>
  <rect width="720" height="860" rx="28" fill="url(#grid)"/>
  <circle cx="92" cy="88" r="250" fill="url(#glowA)"/>
  <circle cx="650" cy="405" r="310" fill="url(#glowB)"/>
  <rect x="1" y="1" width="718" height="858" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="34" y="34" width="652" height="48" rx="24" fill="#08243a" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle cx="59" cy="58" r="6" fill="#2dd4bf"/>
    <text x="80" y="65" fill="#bae6fd" font-size="18" font-weight="700" letter-spacing="1.7">SUPPORT  ·  QA  ·  PRODUCTION OPERATIONS</text>

    <text x="34" y="170" fill="#f8fafc" font-size="86" font-weight="800" letter-spacing="-2">THANOS</text>
    <rect x="34" y="190" width="450" height="6" rx="3" fill="url(#accent)"/>
    <text x="34" y="240" fill="#e2e8f0" font-size="31" font-weight="650">I keep web applications reliable.</text>
    <text x="34" y="280" fill="#94a3b8" font-size="20">Troubleshoot · verify · document · hand over</text>

    <g>
      <rect x="34" y="316" width="652" height="242" rx="20" fill="#07111f" stroke="#334155" stroke-width="1.5"/>
      <circle cx="62" cy="344" r="6" fill="#fb7185"/>
      <circle cx="84" cy="344" r="6" fill="#fbbf24"/>
      <circle cx="106" cy="344" r="6" fill="#34d399"/>
      <text x="134" y="350" fill="#64748b" font-size="16" font-weight="700" letter-spacing="1.4">SUPPORT LOOP</text>

      <line x1="78" y1="390" x2="78" y2="516" stroke="#164e63" stroke-width="3"/>
      <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="19">
        <circle cx="78" cy="395" r="7" fill="#38bdf8"/>
        <text x="108" y="402" fill="#e2e8f0">01  reproduce</text>
        <circle cx="78" cy="455" r="7" fill="#2dd4bf"/>
        <text x="108" y="462" fill="#e2e8f0">02  isolate</text>
        <circle cx="78" cy="515" r="7" fill="#818cf8"/>
        <text x="108" y="522" fill="#e2e8f0">03  coordinate</text>

        <line x1="395" y1="390" x2="395" y2="516" stroke="#312e81" stroke-width="3"/>
        <circle cx="395" cy="395" r="7" fill="#818cf8"/>
        <text x="425" y="402" fill="#e2e8f0">04  verify</text>
        <circle cx="395" cy="455" r="7" fill="#a78bfa"/>
        <text x="425" y="462" fill="#e2e8f0">05  hand over</text>
        <circle cx="395" cy="515" r="7" fill="#2dd4bf"/>
        <text x="425" y="522" fill="#e2e8f0">06  support</text>
      </g>
    </g>

    <g>
      <g transform="translate(34 590)">
        <rect width="316" height="104" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
        <text x="22" y="45" fill="#f8fafc" font-size="33" font-weight="800">60+</text>
        <text x="22" y="76" fill="#94a3b8" font-size="16" font-weight="700" letter-spacing="1.2">LIVE SITES</text>
      </g>
      <g transform="translate(370 590)">
        <rect width="316" height="104" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
        <text x="22" y="45" fill="#f8fafc" font-size="33" font-weight="800">2.5 YEARS</text>
        <text x="22" y="76" fill="#94a3b8" font-size="16" font-weight="700" letter-spacing="1.2">APP SUPPORT</text>
      </g>
      <g transform="translate(34 714)">
        <rect width="316" height="104" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
        <text x="22" y="45" fill="#f8fafc" font-size="33" font-weight="800">BSc · 2:1</text>
        <text x="22" y="76" fill="#94a3b8" font-size="16" font-weight="700" letter-spacing="1.2">COMPUTING · 2026</text>
      </g>
      <g transform="translate(370 714)">
        <rect width="316" height="104" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
        <text x="22" y="45" fill="#f8fafc" font-size="33" font-weight="800">REMOTE</text>
        <text x="22" y="76" fill="#94a3b8" font-size="16" font-weight="700" letter-spacing="1.2">BASED IN GREECE</text>
      </g>
    </g>
  </g>
</svg>
