<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">How Athanasios Zaprios creates value</title>
  <desc id="desc">Three memorable areas: protect customers, prove releases and enable teams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111c31"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="720" height="760" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="758" rx="23" fill="none" stroke="#334155"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="34" y="43" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.8">THE SIMPLE VERSION</text>
    <text x="34" y="78" fill="#f8fafc" font-size="27" font-weight="800">What I help teams achieve</text>

    <g transform="translate(34 108)">
      <rect width="652" height="180" rx="18" fill="#0b1b30" stroke="#38bdf8" stroke-opacity="0.45"/>
      <circle cx="50" cy="51" r="25" fill="url(#blue)"/>
      <path d="M50 35l16 7v12c0 12-9 21-16 25-8-4-16-13-16-25V42z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <text x="92" y="42" fill="#7dd3fc" font-size="13" font-weight="800" letter-spacing="1.3">PROTECT CUSTOMERS</text>
      <text x="92" y="73" fill="#f8fafc" font-size="22" font-weight="800">Keep live services reliable</text>
      <text x="26" y="122" fill="#cbd5e1" font-size="17">Troubleshoot incidents, recover safely and communicate</text>
      <text x="26" y="148" fill="#cbd5e1" font-size="17">clearly when something goes wrong.</text>
    </g>

    <g transform="translate(34 308)">
      <rect width="652" height="180" rx="18" fill="#0b1b30" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <circle cx="50" cy="51" r="25" fill="url(#teal)"/>
      <path d="M36 51l10 10 20-22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="42" fill="#5eead4" font-size="13" font-weight="800" letter-spacing="1.3">PROVE RELEASES</text>
      <text x="92" y="73" fill="#f8fafc" font-size="22" font-weight="800">Test before customers find defects</text>
      <text x="26" y="122" fill="#cbd5e1" font-size="17">Check important journeys, capture evidence and make</text>
      <text x="26" y="148" fill="#cbd5e1" font-size="17">release decisions easier and safer.</text>
    </g>

    <g transform="translate(34 508)">
      <rect width="652" height="180" rx="18" fill="#0b1b30" stroke="#a78bfa" stroke-opacity="0.45"/>
      <circle cx="50" cy="51" r="25" fill="url(#violet)"/>
      <circle cx="44" cy="45" r="7" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="60" cy="56" r="6" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M31 68c2-10 9-15 17-15M51 72c2-8 7-12 14-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="92" y="42" fill="#c4b5fd" font-size="13" font-weight="800" letter-spacing="1.3">ENABLE TEAMS</text>
      <text x="92" y="73" fill="#f8fafc" font-size="22" font-weight="800">Turn technical work into confidence</text>
      <text x="26" y="122" fill="#cbd5e1" font-size="17">Explain decisions, document outcomes and help customers</text>
      <text x="26" y="148" fill="#cbd5e1" font-size="17">manage routine work independently.</text>
    </g>
  </g>
</svg>
