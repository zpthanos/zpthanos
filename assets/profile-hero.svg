<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Thanos — Web Application Support and QA Engineer</title>
  <desc id="description">Professional profile banner highlighting partner delivery, web application support, quality assurance, release assurance, WordPress, WooCommerce, Playwright, Cloudflare, Linux, and SQL experience.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.52" stop-color="#0a1d31"/>
      <stop offset="1" stop-color="#10162b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7dd3fc" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <rect width="1200" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="164" cy="78" r="260" fill="url(#glowA)"/>
  <circle cx="1060" cy="96" r="300" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect x="58" y="42" width="573" height="36" rx="18" fill="#08243a" stroke="#38bdf8" stroke-opacity="0.45"/>
      <circle cx="79" cy="60" r="5" fill="#2dd4bf"/>
      <text x="94" y="65" fill="#bae6fd" font-size="14" font-weight="700" letter-spacing="1.7">WEB APPLICATION SUPPORT  ·  QA  ·  OPERATIONS</text>
    </g>

    <text x="58" y="157" fill="#f8fafc" font-size="76" font-weight="800" letter-spacing="-2">THANOS</text>
    <rect x="58" y="174" width="390" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="58" y="220" fill="#e2e8f0" font-size="27" font-weight="650">I deliver reliable web outcomes, end to end.</text>
    <text x="58" y="254" fill="#94a3b8" font-size="18">Partner delivery · application support · QA · release assurance</text>
    <text x="58" y="294" fill="#7dd3fc" font-size="16" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">WordPress / WooCommerce   Playwright   Cloudflare   Linux   SQL</text>

    <g filter="url(#shadow)">
      <rect x="812" y="42" width="330" height="264" rx="20" fill="#07111f" stroke="#334155" stroke-width="1.5"/>
      <circle cx="840" cy="68" r="5" fill="#fb7185"/>
      <circle cx="858" cy="68" r="5" fill="#fbbf24"/>
      <circle cx="876" cy="68" r="5" fill="#34d399"/>
      <text x="905" y="73" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.3">SUPPORT LOOP</text>

      <line x1="849" y1="106" x2="849" y2="266" stroke="#164e63" stroke-width="2"/>
      <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14">
        <circle cx="849" cy="111" r="6" fill="#38bdf8"/>
        <text x="873" y="116" fill="#e2e8f0">01  reproduce</text>
        <circle cx="849" cy="149" r="6" fill="#22d3ee"/>
        <text x="873" y="154" fill="#e2e8f0">02  isolate</text>
        <circle cx="849" cy="187" r="6" fill="#2dd4bf"/>
        <text x="873" y="192" fill="#e2e8f0">03  coordinate</text>
        <circle cx="849" cy="225" r="6" fill="#818cf8"/>
        <text x="873" y="230" fill="#e2e8f0">04  verify</text>
        <circle cx="849" cy="263" r="6" fill="#a78bfa"/>
        <text x="873" y="268" fill="#e2e8f0">05  hand over</text>
      </g>
    </g>

    <g>
      <g transform="translate(58 336)">
        <rect width="248" height="68" rx="14" fill="#0b1728" stroke="#1e3a5f"/>
        <text x="18" y="30" fill="#f8fafc" font-size="23" font-weight="800">60+</text>
        <text x="18" y="51" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">LIVE SITES</text>
      </g>
      <g transform="translate(326 336)">
        <rect width="248" height="68" rx="14" fill="#0b1728" stroke="#1e3a5f"/>
        <text x="18" y="30" fill="#f8fafc" font-size="23" font-weight="800">2.5 YEARS</text>
        <text x="18" y="51" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">APP SUPPORT</text>
      </g>
      <g transform="translate(594 336)">
        <rect width="248" height="68" rx="14" fill="#0b1728" stroke="#1e3a5f"/>
        <text x="18" y="30" fill="#f8fafc" font-size="23" font-weight="800">BSc · 2:1</text>
        <text x="18" y="51" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">COMPUTING · 2026</text>
      </g>
      <g transform="translate(862 336)">
        <rect width="280" height="68" rx="14" fill="#0b1728" stroke="#1e3a5f"/>
        <text x="18" y="30" fill="#f8fafc" font-size="23" font-weight="800">REMOTE</text>
        <text x="18" y="51" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">BASED IN GREECE</text>
      </g>
    </g>
  </g>
</svg>
