<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="title desc">
  <title id="title">Athanasios Zaprios — WordPress and WooCommerce Technical Support</title>
  <desc id="desc">Compact mobile profile banner focused on WordPress and WooCommerce technical support, application support, quality assurance and production operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.62" stop-color="#0b1d31"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="720" height="470" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="468" rx="23" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="34" y="52" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="2">ATHANASIOS ZAPRIOS</text>
    <text x="34" y="108" fill="#f8fafc" font-size="38" font-weight="800">WordPress &amp; WooCommerce</text>
    <text x="34" y="154" fill="#f8fafc" font-size="42" font-weight="800">Technical Support</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="18">Customer support · Application support</text>
    <text x="34" y="226" fill="#cbd5e1" font-size="18">QA &amp; release · Production operations</text>
    <rect x="34" y="250" width="560" height="5" rx="3" fill="url(#accent)"/>

    <rect x="34" y="286" width="652" height="112" rx="18" fill="#07111f" fill-opacity="0.76" stroke="#334155"/>
    <text x="58" y="320" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.4">SUPPORT THAT CLOSES THE LOOP</text>
    <circle cx="66" cy="358" r="6" fill="#38bdf8"/><text x="84" y="364" fill="#e2e8f0" font-size="16" font-weight="700">Investigate</text>
    <circle cx="274" cy="358" r="6" fill="#2dd4bf"/><text x="292" y="364" fill="#e2e8f0" font-size="16" font-weight="700">Verify</text>
    <circle cx="430" cy="358" r="6" fill="#a78bfa"/><text x="448" y="364" fill="#e2e8f0" font-size="16" font-weight="700">Communicate</text>

    <text x="34" y="438" fill="#94a3b8" font-size="15" font-weight="600">Greece · Remote EMEA · Customers ↔ Engineering ↔ Production</text>
  </g>
</svg>
