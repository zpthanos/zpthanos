<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 930" role="img" aria-labelledby="title desc">
  <title id="title">Athanasios Zaprios — WordPress and WooCommerce Customer Support</title>
  <desc id="desc">Mobile profile banner presenting WordPress and WooCommerce customer support backed by technical delivery across customers, engineering, quality assurance and production.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1d31"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="720" height="930" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="928" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="34" y="56" fill="#7dd3fc" font-size="16" font-weight="700" letter-spacing="2">ATHANASIOS ZAPRIOS</text>
    <text x="34" y="118" fill="#f8fafc" font-size="39" font-weight="800">WordPress &amp; WooCommerce</text>
    <text x="34" y="168" fill="#f8fafc" font-size="43" font-weight="800">Customer Support</text>
    <text x="34" y="216" fill="#cbd5e1" font-size="20">Customer-facing support connecting customers,</text>
    <text x="34" y="246" fill="#cbd5e1" font-size="20">engineering, QA and production.</text>
    <rect x="34" y="270" width="540" height="6" rx="3" fill="url(#accent)"/>

    <g font-size="15" font-weight="700">
      <rect x="34" y="306" width="316" height="44" rx="22" fill="#0f2a43" stroke="#38bdf8" stroke-opacity="0.35"/><text x="77" y="334" fill="#bae6fd">TECHNICAL ACCOUNTS</text>
      <rect x="370" y="306" width="316" height="44" rx="22" fill="#0f2a43" stroke="#2dd4bf" stroke-opacity="0.35"/><text x="411" y="334" fill="#99f6e4">APPLICATION SUPPORT</text>
      <rect x="34" y="366" width="316" height="44" rx="22" fill="#0f2a43" stroke="#818cf8" stroke-opacity="0.35"/><text x="96" y="394" fill="#c7d2fe">QA &amp; RELEASE</text>
      <rect x="370" y="366" width="316" height="44" rx="22" fill="#0f2a43" stroke="#a78bfa" stroke-opacity="0.35"/><text x="424" y="394" fill="#ddd6fe">SOLUTIONS &amp; WEB</text>
    </g>

    <rect x="34" y="448" width="652" height="210" rx="22" fill="#07111f" stroke="#334155"/>
    <text x="62" y="484" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.4">HOW I ADD VALUE</text>
    <g font-size="17" font-weight="700" fill="#e2e8f0">
      <circle cx="72" cy="526" r="7" fill="#38bdf8"/><text x="94" y="532">Clarify requirements</text>
      <circle cx="72" cy="566" r="7" fill="#2dd4bf"/><text x="94" y="572">Coordinate delivery</text>
      <circle cx="390" cy="526" r="7" fill="#818cf8"/><text x="412" y="532">Verify releases</text>
      <circle cx="390" cy="566" r="7" fill="#a78bfa"/><text x="412" y="572">Support production</text>
    </g>
    <text x="62" y="622" fill="#64748b" font-size="14">Clear process. Visible evidence. Reliable handover.</text>

    <g transform="translate(34 698)">
      <g><rect width="316" height="90" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="41" fill="#f8fafc" font-size="30" font-weight="800">60+</text><text x="20" y="66" fill="#94a3b8" font-size="13" font-weight="700">LIVE SITES &amp; APPS</text></g>
      <g transform="translate(336 0)"><rect width="316" height="90" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="41" fill="#f8fafc" font-size="30" font-weight="800">30</text><text x="20" y="66" fill="#94a3b8" font-size="13" font-weight="700">CLIENT ENGAGEMENTS</text></g>
      <g transform="translate(0 108)"><rect width="316" height="90" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="41" fill="#f8fafc" font-size="30" font-weight="800">3+ YEARS</text><text x="20" y="66" fill="#94a3b8" font-size="13" font-weight="700">CLIENT-FACING DELIVERY</text></g>
      <g transform="translate(336 108)"><rect width="316" height="90" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="41" fill="#f8fafc" font-size="30" font-weight="800">21</text><text x="20" y="66" fill="#94a3b8" font-size="13" font-weight="700">PRODUCTION STORIES</text></g>
    </g>
  </g>
</svg>