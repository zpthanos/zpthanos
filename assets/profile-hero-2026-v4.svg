<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Athanasios Zaprios — WordPress and WooCommerce Technical Support</title>
<desc id="desc">Recruiter-focused profile banner showing technical support, QA, release and production experience.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07101f"/>
    <stop offset="0.54" stop-color="#0b2036"/>
    <stop offset="1" stop-color="#17203b"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="0.5" stop-color="#2dd4bf"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".25"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".20"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#c4e8ff" stroke-opacity=".035"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/>
  </filter>
</defs>

<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<circle cx="1000" cy="86" r="245" fill="url(#glow1)"/>
<circle cx="1125" cy="320" r="220" fill="url(#glow2)"/>
<rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#7dd3fc" stroke-opacity=".20" stroke-width="2"/>

<g font-family="Inter, Segoe UI, Arial, sans-serif">
  <text x="52" y="52" fill="#7dd3fc" font-size="14" font-weight="800" letter-spacing="2.2">ATHANASIOS ZAPRIOS</text>
  <text x="52" y="110" fill="#f8fafc" font-size="44" font-weight="800">WordPress &amp; WooCommerce</text>
  <text x="52" y="158" fill="#f8fafc" font-size="44" font-weight="800">Technical Support</text>
  <text x="52" y="200" fill="#cbd5e1" font-size="18">I investigate customer issues, verify safe fixes and close the loop clearly.</text>
  <rect x="52" y="222" width="635" height="5" rx="3" fill="url(#accent)"/>

  <g transform="translate(52 250)" font-size="13" font-weight="800">
    <g><rect width="136" height="54" rx="14" fill="#0b1728" stroke="#38bdf8" stroke-opacity=".42"/><text x="16" y="25" fill="#f8fafc" font-size="21">60+</text><text x="16" y="43" fill="#94a3b8" font-size="10.5" letter-spacing=".7">LIVE SITES</text></g>
    <g transform="translate(148 0)"><rect width="142" height="54" rx="14" fill="#0b1728" stroke="#2dd4bf" stroke-opacity=".42"/><text x="16" y="25" fill="#f8fafc" font-size="21">30</text><text x="16" y="43" fill="#94a3b8" font-size="10.5" letter-spacing=".7">ENGAGEMENTS</text></g>
    <g transform="translate(302 0)"><rect width="154" height="54" rx="14" fill="#0b1728" stroke="#818cf8" stroke-opacity=".42"/><text x="16" y="25" fill="#f8fafc" font-size="21">2,000+</text><text x="16" y="43" fill="#94a3b8" font-size="10.5" letter-spacing=".7">STORE PRODUCTS</text></g>
    <g transform="translate(468 0)"><rect width="158" height="54" rx="14" fill="#0b1728" stroke="#a78bfa" stroke-opacity=".42"/><text x="16" y="25" fill="#f8fafc" font-size="21">21</text><text x="16" y="43" fill="#94a3b8" font-size="10.5" letter-spacing=".7">PRODUCTION STORIES</text></g>
  </g>

  <g transform="translate(790 46)" filter="url(#shadow)">
    <rect width="354" height="268" rx="24" fill="#081426" fill-opacity=".92" stroke="#334155"/>
    <text x="28" y="38" fill="#94a3b8" font-size="11.5" font-weight="800" letter-spacing="1.6">SUPPORT THAT CLOSES THE LOOP</text>

    <g transform="translate(28 60)">
      <rect width="298" height="50" rx="14" fill="#0d2238" stroke="#38bdf8" stroke-opacity=".42"/>
      <circle cx="25" cy="25" r="11" fill="#38bdf8"/><text x="21" y="30" fill="#07101f" font-size="14" font-weight="900">1</text>
      <text x="48" y="22" fill="#f8fafc" font-size="16" font-weight="800">Investigate</text>
      <text x="48" y="38" fill="#94a3b8" font-size="11.5">Reproduce, isolate, collect evidence</text>
    </g>
    <g transform="translate(28 122)">
      <rect width="298" height="50" rx="14" fill="#0d2238" stroke="#2dd4bf" stroke-opacity=".42"/>
      <circle cx="25" cy="25" r="11" fill="#2dd4bf"/><text x="21" y="30" fill="#07101f" font-size="14" font-weight="900">2</text>
      <text x="48" y="22" fill="#f8fafc" font-size="16" font-weight="800">Verify</text>
      <text x="48" y="38" fill="#94a3b8" font-size="11.5">Test the fix and critical journeys</text>
    </g>
    <g transform="translate(28 184)">
      <rect width="298" height="50" rx="14" fill="#0d2238" stroke="#a78bfa" stroke-opacity=".42"/>
      <circle cx="25" cy="25" r="11" fill="#a78bfa"/><text x="21" y="30" fill="#07101f" font-size="14" font-weight="900">3</text>
      <text x="48" y="22" fill="#f8fafc" font-size="16" font-weight="800">Communicate</text>
      <text x="48" y="38" fill="#94a3b8" font-size="11.5">Explain outcomes, risks and next steps</text>
    </g>
  </g>
</g>
</svg>