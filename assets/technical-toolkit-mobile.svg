<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-label="Technical toolkit used across support, troubleshooting, integrations, QA, ecommerce, infrastructure and security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="704" height="924" rx="24" fill="url(#bg)" stroke="#1E3A5F" stroke-width="2"/>
  <rect x="30" y="28" width="176" height="36" rx="18" fill="#20B8A6"/>
  <text x="118" y="52" text-anchor="middle" fill="#031711" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">PRACTICAL TOOLKIT</text>

  <text x="30" y="110" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Tools I reach for when the</text>
  <text x="30" y="142" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">problem needs evidence.</text>
  <text x="30" y="178" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="14">Grouped by how they are used.</text>

  <rect x="30" y="210" width="660" height="102" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="238" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">SUPPORT &amp; ACCOUNT OPS</text>
  <text x="50" y="267" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Own, coordinate, explain</text>
  <text x="50" y="291" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Jira · escalation · onboarding · docs · training</text>

  <rect x="30" y="326" width="660" height="102" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="354" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">TROUBLESHOOTING</text>
  <text x="50" y="383" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Observe before guessing</text>
  <text x="50" y="407" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">DevTools · logs · HTTP/S · TLS · DNS · Wireshark</text>

  <rect x="30" y="442" width="660" height="102" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="470" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">APIS &amp; INTEGRATIONS</text>
  <text x="50" y="499" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Make the request reproducible</text>
  <text x="50" y="523" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">REST · webhooks · JSON · XML · request / response</text>

  <rect x="30" y="558" width="660" height="102" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="586" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">QA &amp; RELEASE</text>
  <text x="50" y="615" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Verify the customer journey</text>
  <text x="50" y="639" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Playwright · BrowserStack · regression · accessibility</text>

  <rect x="30" y="674" width="660" height="102" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="702" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">WEB &amp; ECOMMERCE</text>
  <text x="50" y="731" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Understand the application</text>
  <text x="50" y="755" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">WordPress · WooCommerce · PHP · JS · MySQL · caching</text>

  <rect x="30" y="790" width="660" height="102" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="50" y="818" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">INFRASTRUCTURE &amp; SECURITY</text>
  <text x="50" y="847" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Control change and risk</text>
  <text x="50" y="871" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="13">Cloudflare · WAF · CDN · cPanel · Plesk · Redis</text>

  <text x="30" y="918" fill="#2F8FBE" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">TOOLS SUPPORT THE INVESTIGATION. EVIDENCE DRIVES THE DECISION.</text>
</svg>