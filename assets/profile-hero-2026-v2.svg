<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Athanasios Zaprios — WordPress and WooCommerce Technical Support</title>
  <desc id="desc">Compact professional profile banner focused on WordPress and WooCommerce technical support, application support, quality assurance and production operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.62" stop-color="#0b1d31"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="1030" cy="150" r="190" fill="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="54" y="58" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="2.2">ATHANASIOS ZAPRIOS</text>
    <text x="54" y="116" fill="#f8fafc" font-size="42" font-weight="800">WordPress &amp; WooCommerce</text>
    <text x="54" y="162" fill="#f8fafc" font-size="42" font-weight="800">Technical Support</text>
    <text x="54" y="202" fill="#cbd5e1" font-size="18">Customer support · Application support · QA &amp; release · Production operations</text>
    <rect x="54" y="224" width="620" height="5" rx="3" fill="url(#accent)"/>
    <text x="54" y="261" fill="#94a3b8" font-size="15" font-weight="600">Greece · Remote EMEA · Customers ↔ Engineering ↔ Production</text>

    <g transform="translate(862 54)">
      <rect width="280" height="192" rx="20" fill="#07111f" fill-opacity="0.78" stroke="#334155"/>
      <text x="24" y="36" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">SUPPORT THAT CLOSES THE LOOP</text>
      <path d="M128 75H218M218 75L206 64M218 75L206 86" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M128 116H218M218 116L206 105M218 116L206 127" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M128 157H218M218 157L206 146M218 157L206 168" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="80" fill="#e2e8f0" font-size="15" font-weight="700">Investigate</text>
      <text x="25" y="121" fill="#e2e8f0" font-size="15" font-weight="700">Verify</text>
      <text x="25" y="162" fill="#e2e8f0" font-size="15" font-weight="700">Communicate</text>
      <circle cx="236" cy="75" r="7" fill="#38bdf8"/>
      <circle cx="236" cy="116" r="7" fill="#2dd4bf"/>
      <circle cx="236" cy="157" r="7" fill="#a78bfa"/>
    </g>
  </g>
</svg>
