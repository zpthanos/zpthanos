<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Athanasios Zaprios — Technical Delivery Professional</title>
  <desc id="desc">Professional profile banner presenting broad technical delivery experience across customer support, engineering, quality assurance and production.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d31"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="478" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="62" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="2">ATHANASIOS ZAPRIOS</text>
    <text x="58" y="120" fill="#f8fafc" font-size="46" font-weight="800">Technical Delivery Professional</text>
    <text x="58" y="161" fill="#cbd5e1" font-size="20">Customer-facing engineer connecting customers, engineering, QA and production.</text>
    <rect x="58" y="184" width="700" height="5" rx="3" fill="url(#accent)"/>

    <g font-size="14" font-weight="700">
      <rect x="58" y="218" width="190" height="40" rx="20" fill="#0f2a43" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="82" y="244" fill="#bae6fd">TECHNICAL ACCOUNTS</text>
      <rect x="262" y="218" width="190" height="40" rx="20" fill="#0f2a43" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <text x="286" y="244" fill="#99f6e4">APPLICATION SUPPORT</text>
      <rect x="466" y="218" width="160" height="40" rx="20" fill="#0f2a43" stroke="#818cf8" stroke-opacity="0.35"/>
      <text x="500" y="244" fill="#c7d2fe">QA &amp; RELEASE</text>
      <rect x="640" y="218" width="180" height="40" rx="20" fill="#0f2a43" stroke="#a78bfa" stroke-opacity="0.35"/>
      <text x="669" y="244" fill="#ddd6fe">SOLUTIONS &amp; WEB</text>
    </g>

    <g transform="translate(850 55)">
      <rect width="292" height="205" rx="20" fill="#07111f" stroke="#334155"/>
      <text x="24" y="34" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.4">HOW I ADD VALUE</text>
      <g font-size="15" font-weight="700" fill="#e2e8f0">
        <circle cx="31" cy="72" r="6" fill="#38bdf8"/><text x="49" y="77">Clarify requirements</text>
        <circle cx="31" cy="108" r="6" fill="#2dd4bf"/><text x="49" y="113">Coordinate delivery</text>
        <circle cx="31" cy="144" r="6" fill="#818cf8"/><text x="49" y="149">Verify releases</text>
        <circle cx="31" cy="180" r="6" fill="#a78bfa"/><text x="49" y="185">Support production</text>
      </g>
    </g>

    <g transform="translate(58 310)">
      <g><rect width="250" height="105" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="45" fill="#f8fafc" font-size="30" font-weight="800">60+</text><text x="20" y="72" fill="#94a3b8" font-size="13" font-weight="700">LIVE SITES &amp; APPS</text></g>
      <g transform="translate(268 0)"><rect width="250" height="105" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="45" fill="#f8fafc" font-size="30" font-weight="800">30</text><text x="20" y="72" fill="#94a3b8" font-size="13" font-weight="700">CLIENT ENGAGEMENTS</text></g>
      <g transform="translate(536 0)"><rect width="250" height="105" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="45" fill="#f8fafc" font-size="30" font-weight="800">3+ YEARS</text><text x="20" y="72" fill="#94a3b8" font-size="13" font-weight="700">CLIENT-FACING DELIVERY</text></g>
      <g transform="translate(804 0)"><rect width="280" height="105" rx="16" fill="#0b1728" stroke="#1e3a5f"/><text x="20" y="45" fill="#f8fafc" font-size="30" font-weight="800">21</text><text x="20" y="72" fill="#94a3b8" font-size="13" font-weight="700">PRODUCTION STORIES</text></g>
    </g>
  </g>
</svg>