    <text x="24" y="40" fill="#94a3b8" font-size="17" font-weight="800" letter-spacing="1.5">CUSTOMER EVIDENCE</text>
    <g>
      <rect x="22" y="62" width="145" height="92" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
      <text x="40" y="105" fill="#f8fafc" font-size="34" font-weight="900">60+</text>
      <text x="40" y="132" fill="#cbd5e1" font-size="18" font-weight="700">PRODUCTION SITES</text>
      <rect x="185" y="62" width="145" height="92" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
      <text x="203" y="105" fill="#f8fafc" font-size="34" font-weight="900">30</text>
      <text x="203" y="132" fill="#cbd5e1" font-size="18" font-weight="700">ENGAGEMENTS</text>
      <rect x="22" y="172" width="145" height="92" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
      <text x="40" y="215" fill="#f8fafc" font-size="34" font-weight="900">12</text>
      <text x="40" y="242" fill="#cbd5e1" font-size="18" font-weight="700">ECOMMERCE STORES</text>
      <rect x="185" y="172" width="145" height="92" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
      <text x="203" y="215" fill="#f8fafc" font-size="34" font-weight="900">3+ YEARS</text>
      <text x="203" y="242" fill="#cbd5e1" font-size="18" font-weight="700">CUSTOMER-FACING</text>
