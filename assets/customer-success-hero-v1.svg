<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Athanasios Zaprios — Customer Success and Technical Support</title>
<desc id="desc">Customer success and technical support profile highlighting 60 plus production sites, 30 customer engagements, 12 WooCommerce stores and more than three years of customer-facing delivery.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/>
    <stop offset="0.52" stop-color="#0b2036"/>
    <stop offset="1" stop-color="#18213c"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="0.52" stop-color="#2dd4bf"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity="0.035"/>
  </pattern>
</defs>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/>
<rect width="1200" height="390" rx="28" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2"/>
<circle cx="1040" cy="110" r="250" fill="url(#glow)"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
  <text x="56" y="58" fill="#7dd3fc" font-size="20" font-weight="800" letter-spacing="2.2">ATHANASIOS ZAPRIOS</text>
  <text x="56" y="125" fill="#f8fafc" font-size="54" font-weight="900">Customer Success &amp;</text>
  <text x="56" y="184" fill="#f8fafc" font-size="54" font-weight="900">Technical Support</text>
  <text x="56" y="228" fill="#cbd5e1" font-size="24" font-weight="600">Onboarding · Ticket resolution · Risk identification · Customer enablement</text>
  <rect x="56" y="252" width="690" height="6" rx="3" fill="url(#accent)"/>
  <text x="56" y="296" fill="#a5b4c8" font-size="21" font-weight="600">WordPress · WooCommerce · Linux-based platforms · Web infrastructure</text>
  <text x="56" y="337" fill="#94a3b8" font-size="20" font-weight="600">Remote from Greece · EMEA time zone · English &amp; Greek</text>

  <g transform="translate(790 48)">
