<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How Athanasios Zaprios creates value</title>
  <desc id="desc">Three memorable areas: protect customers, prove releases and enable teams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#334155"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="44" y="42" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.8">THE SIMPLE VERSION</text>
    <text x="44" y="75" fill="#f8fafc" font-size="25" font-weight="800">What I help teams achieve</text>

    <g transform="translate(44 99)">
      <rect width="348" height="160" rx="18" fill="#0b1b30" stroke="#38bdf8" stroke-opacity="0.45"/>
      <circle cx="44" cy="43" r="23" fill="url(#blue)"/>
      <path d="M44 28l15 6v11c0 12-8 20-15 24-7-4-15-12-15-24V34z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <text x="82" y="39" fill="#7dd3fc" font-size="12" font-weight="800" letter-spacing="1.3">PROTECT CUSTOMERS</text>
      <text x="82" y="66" fill="#f8fafc" font-size="20" font-weight="800">Keep live services reliable</text>
      <text x="24" y="118" fill="#cbd5e1" font-size="14">Troubleshoot incidents, recover safely and</text>
      <text x="24" y="140" fill="#cbd5e1" font-size="14">communicate clearly when something goes wrong.</text>
    </g>

    <g transform="translate(426 99)">
      <rect width="348" height="160" rx="18" fill="#0b1b30" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <circle cx="44" cy="43" r="23" fill="url(#teal)"/>
      <path d="M31 43l9 9 18-20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="39" fill="#5eead4" font-size="12" font-weight="800" letter-spacing="1.3">PROVE RELEASES</text>
      <text x="82" y="61" fill="#f8fafc" font-size="18" font-weight="800">Test before customers</text>
      <text x="82" y="83" fill="#f8fafc" font-size="18" font-weight="800">find defects</text>
      <text x="24" y="118" fill="#cbd5e1" font-size="14">Check important journeys, capture evidence and</text>
      <text x="24" y="140" fill="#cbd5e1" font-size="14">make release decisions easier and safer.</text>
    </g>

    <g transform="translate(808 99)">
      <rect width="348" height="160" rx="18" fill="#0b1b30" stroke="#a78bfa" stroke-opacity="0.45"/>
      <circle cx="44" cy="43" r="23" fill="url(#violet)"/>
      <circle cx="38" cy="38" r="7" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="54" cy="49" r="6" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M25 61c2-10 9-15 17-15M45 65c2-8 7-12 14-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="39" fill="#c4b5fd" font-size="12" font-weight="800" letter-spacing="1.3">ENABLE TEAMS</text>
      <text x="82" y="61" fill="#f8fafc" font-size="18" font-weight="800">Turn technical work</text>
      <text x="82" y="83" fill="#f8fafc" font-size="18" font-weight="800">into confidence</text>
      <text x="24" y="118" fill="#cbd5e1" font-size="14">Explain decisions, document outcomes and help</text>
      <text x="24" y="140" fill="#cbd5e1" font-size="14">customers manage routine work independently.</text>
    </g>
  </g>
</svg>
