<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" role="img" aria-labelledby="title desc">
<title id="title">Three customer outcomes</title>
<desc id="desc">A compromised store safely relaunched, a 2,000-plus product catalogue enabled, and PageSpeed improved from below 20 to above 75.</desc>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="235" rx="24" fill="#0b2036" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="30" y="44" fill="#7dd3fc" font-size="20" font-weight="900">RECOVERY &amp; TRUST</text>
  <text x="30" y="96" fill="#f8fafc" font-size="40" font-weight="900">SAFELY RELAUNCHED</text>
  <text x="30" y="146" fill="#cbd5e1" font-size="24" font-weight="650">Recovered a compromised store and verified</text><text x="30" y="181" fill="#cbd5e1" font-size="24" font-weight="650">catalogue, cart and checkout before relaunch.</text>
  <rect x="0" y="267" width="720" height="235" rx="24" fill="#092932" stroke="#2dd4bf" stroke-opacity="0.55"/>
  <text x="30" y="311" fill="#5eead4" font-size="20" font-weight="900">ONBOARDING &amp; ADOPTION</text>
  <text x="30" y="363" fill="#f8fafc" font-size="40" font-weight="900">2,000+ PRODUCTS ENABLED</text>
  <text x="30" y="413" fill="#cbd5e1" font-size="24" font-weight="650">Configured workflows and trained the owner</text><text x="30" y="448" fill="#cbd5e1" font-size="24" font-weight="650">to manage routine work independently.</text>
  <rect x="0" y="534" width="720" height="235" rx="24" fill="#171936" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text x="30" y="578" fill="#c4b5fd" font-size="20" font-weight="900">RELIABILITY &amp; VALUE</text>
  <text x="30" y="630" fill="#f8fafc" font-size="40" font-weight="900">&lt;20 → 75+ PAGESPEED</text>
  <text x="30" y="680" fill="#cbd5e1" font-size="24" font-weight="650">Improved performance while protecting the</text><text x="30" y="715" fill="#cbd5e1" font-size="24" font-weight="650">catalogue, cart and checkout journey.</text>
</g>
</svg>
