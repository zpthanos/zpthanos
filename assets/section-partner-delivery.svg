<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" role="img" aria-labelledby="title description">
  <title id="title">Partner delivery and support lifecycle</title>
  <desc id="description">A rounded professional section title panel in indigo and violet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10162b"/>
      <stop offset="1" stop-color="#17152d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="90" rx="18" fill="url(#background)" stroke="#818cf8" stroke-opacity="0.42" stroke-width="2"/>
  <circle cx="1040" cy="46" r="210" fill="url(#glow)"/>
  <rect x="0" y="0" width="9" height="92" rx="4.5" fill="url(#accent)"/>
  <circle cx="49" cy="46" r="12" fill="#17152d" stroke="#818cf8" stroke-width="2"/>
  <circle cx="49" cy="46" r="4" fill="#a78bfa"/>
  <text x="82" y="55" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="750" letter-spacing="0.2">Partner delivery and support lifecycle</text>
  <rect x="918" y="34" width="176" height="24" rx="12" fill="#17152d" stroke="#a78bfa" stroke-opacity="0.68"/>
  <text x="1006" y="50" text-anchor="middle" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">DELIVERY LOOP</text>
</svg>
