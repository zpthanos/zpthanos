<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Choose the proof that matches the role</title><desc id="desc">Four recruiter-friendly routes to the most relevant portfolio evidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.58" stop-color="#0b1d31"/><stop offset="1" stop-color="#111827"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/></filter></defs>
<rect width="1200" height="390" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="388" rx="25" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="2"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="42" y="52" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="1.8">QUICK RECRUITER ROUTES</text><text x="42" y="90" fill="#f8fafc" font-size="29" font-weight="900">Choose the proof that matches your role</text><text x="42" y="120" fill="#cbd5e1" font-size="15">Start with the evidence closest to the job. No technical scavenger hunt required.</text>
<g filter="url(#shadow)"><rect x="42" y="150" width="535" height="95" rx="18" fill="#0b1d31" stroke="#38bdf8" stroke-opacity="0.45"/></g><circle cx="80" cy="185" r="19" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/><text x="80" y="191" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="900">01</text><text x="114" y="184" fill="#f8fafc" font-size="18" font-weight="800">Customer or application support</text><text x="114" y="212" fill="#cbd5e1" font-size="14">Real incidents, clear updates and safe follow-through.</text>
<g filter="url(#shadow)"><rect x="623" y="150" width="535" height="95" rx="18" fill="#0b1d31" stroke="#2dd4bf" stroke-opacity="0.45"/></g><circle cx="661" cy="185" r="19" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf" stroke-opacity="0.5"/><text x="661" y="191" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="900">02</text><text x="695" y="184" fill="#f8fafc" font-size="18" font-weight="800">WordPress or WooCommerce support</text><text x="695" y="212" fill="#cbd5e1" font-size="14">A complete shopping journey tested before a real order.</text>
<g filter="url(#shadow)"><rect x="42" y="265" width="535" height="95" rx="18" fill="#0b1d31" stroke="#a78bfa" stroke-opacity="0.45"/></g><circle cx="80" cy="300" r="19" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/><text x="80" y="306" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="900">03</text><text x="114" y="299" fill="#f8fafc" font-size="18" font-weight="800">QA or release coordination</text><text x="114" y="327" fill="#cbd5e1" font-size="14">Browser, accessibility and release evidence people can review.</text>
<g filter="url(#shadow)"><rect x="623" y="265" width="535" height="95" rx="18" fill="#0b1d31" stroke="#f59e0b" stroke-opacity="0.45"/></g><circle cx="661" cy="300" r="19" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/><text x="661" y="306" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="900">04</text><text x="695" y="299" fill="#f8fafc" font-size="18" font-weight="800">Solutions or implementation</text><text x="695" y="327" fill="#cbd5e1" font-size="14">Unclear requirements turned into a testable delivery plan.</text></g></svg>