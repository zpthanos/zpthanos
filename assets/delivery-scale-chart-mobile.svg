<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" role="img" aria-labelledby="title description">
  <title id="title">Delivery scale</title>
  <desc id="description">Mobile horizontal bar chart showing 60 or more websites overall, 30 customer engagements, 18 cross-team collaborations, and 12 full development cycles handled across 2.5 years.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.55" stop-color="#0a1d31"/>
      <stop offset="1" stop-color="#10162b"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="barD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="720" height="850" rx="28" fill="url(#background)"/>
  <circle cx="80" cy="80" r="260" fill="url(#glow)"/>
  <rect x="1" y="1" width="718" height="848" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="34" y="62" fill="#f8fafc" font-size="34" font-weight="750">Delivery scale</text>
    <text x="34" y="96" fill="#94a3b8" font-size="19">Experience and delivery counts at a glance</text>

    <g transform="translate(34 128)">
      <rect width="652" height="112" rx="18" fill="#0b1728" stroke="#2dd4bf" stroke-opacity="0.52"/>
      <text x="24" y="52" fill="#f8fafc" font-size="38" font-weight="800">2.5 YEARS</text>
      <text x="24" y="82" fill="#99f6e4" font-size="14" font-weight="700" letter-spacing="1.7">WEB DELIVERY EXPERIENCE</text>
    </g>

    <g transform="translate(34 286)">
      <text x="0" y="0" fill="#e2e8f0" font-size="23" font-weight="650">Websites overall</text>
      <text x="652" y="0" text-anchor="end" fill="#7dd3fc" font-size="24" font-weight="800">60+</text>
      <rect x="0" y="25" width="652" height="28" rx="14" fill="#0b1728" stroke="#1e3a5f"/>
      <rect x="0" y="25" width="652" height="28" rx="14" fill="url(#barA)"><animate attributeName="width" from="0" to="652" dur="0.8s" fill="freeze"/></rect>
    </g>

    <g transform="translate(34 414)">
      <text x="0" y="0" fill="#e2e8f0" font-size="23" font-weight="650">Customer engagements</text>
      <text x="652" y="0" text-anchor="end" fill="#99f6e4" font-size="24" font-weight="800">30</text>
      <rect x="0" y="25" width="652" height="28" rx="14" fill="#0b1728" stroke="#1e3a5f"/>
      <rect x="0" y="25" width="326" height="28" rx="14" fill="url(#barB)"><animate attributeName="width" from="0" to="326" dur="0.7s" begin="0.08s" fill="freeze"/></rect>
    </g>

    <g transform="translate(34 542)">
      <text x="0" y="0" fill="#e2e8f0" font-size="23" font-weight="650">Cross-team collaborations</text>
      <text x="652" y="0" text-anchor="end" fill="#c7d2fe" font-size="24" font-weight="800">18</text>
      <rect x="0" y="25" width="652" height="28" rx="14" fill="#0b1728" stroke="#1e3a5f"/>
      <rect x="0" y="25" width="196" height="28" rx="14" fill="url(#barC)"><animate attributeName="width" from="0" to="196" dur="0.62s" begin="0.16s" fill="freeze"/></rect>
    </g>

    <g transform="translate(34 670)">
      <text x="0" y="0" fill="#e2e8f0" font-size="23" font-weight="650">Full-cycle deliveries handled</text>
      <text x="652" y="0" text-anchor="end" fill="#ddd6fe" font-size="24" font-weight="800">12</text>
      <rect x="0" y="25" width="652" height="28" rx="14" fill="#0b1728" stroke="#1e3a5f"/>
      <rect x="0" y="25" width="130" height="28" rx="14" fill="url(#barD)"><animate attributeName="width" from="0" to="130" dur="0.54s" begin="0.24s" fill="freeze"/></rect>
    </g>

    <g fill="#64748b" font-size="14" font-weight="650" text-anchor="middle">
      <text x="34" y="790" text-anchor="start">0</text>
      <text x="197" y="790">15</text>
      <text x="360" y="790">30</text>
      <text x="523" y="790">45</text>
      <text x="686" y="790" text-anchor="end">60</text>
    </g>
    <text x="34" y="822" fill="#64748b" font-size="14" font-weight="650" letter-spacing="1.2">COUNT</text>
  </g>
</svg>
