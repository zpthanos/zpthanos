<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title description">
  <title id="title">Customer support and product delivery scale</title>
  <desc id="description">Mobile horizontal bar chart showing 60 production WordPress sites, 30 end-to-end client engagements, and 12 WooCommerce stores, with a lifecycle from requirements through launch, training, and handover.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b16"/><stop offset="0.55" stop-color="#0a1d31"/><stop offset="1" stop-color="#10162b"/></linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="720" height="900" rx="28" fill="url(#background)"/>
  <circle cx="80" cy="80" r="260" fill="url(#glow)"/>
  <rect x="1" y="1" width="718" height="898" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="34" y="58" fill="#f8fafc" font-size="31" font-weight="750">Customer support &amp;</text>
    <text x="34" y="94" fill="#f8fafc" font-size="31" font-weight="750">product delivery scale</text>
    <text x="34" y="128" fill="#94a3b8" font-size="18">Production, ecommerce, and client delivery</text>
    <g transform="translate(34 190)">
      <text x="0" y="0" fill="#e2e8f0" font-size="22" font-weight="650">Production WordPress sites</text><text x="652" y="0" text-anchor="end" fill="#7dd3fc" font-size="24" font-weight="800">60</text>
      <rect x="0" y="25" width="652" height="28" rx="14" fill="#0b1728" stroke="#1e3a5f"/><rect x="0" y="25" width="652" height="28" rx="14" fill="url(#barA)"><animate attributeName="width" from="0" to="652" dur="0.8s" fill="freeze"/></rect>
    </g>
    <g transform="translate(34 320)">
      <text x="0" y="0" fill="#e2e8f0" font-size="22" font-weight="650">End-to-end client engagements</text><text x="652" y="0" text-anchor="end" fill="#99f6e4" font-size="24" font-weight="800">30</text>
      <rect x="0" y="25" width="652" height="28" rx="14" fill="#0b1728" stroke="#1e3a5f"/><rect x="0" y="25" width="326" height="28" rx="14" fill="url(#barB)"><animate attributeName="width" from="0" to="326" dur="0.7s" begin="0.08s" fill="freeze"/></rect>
    </g>
    <g transform="translate(34 450)">
      <text x="0" y="0" fill="#e2e8f0" font-size="22" font-weight="650">WooCommerce stores</text><text x="652" y="0" text-anchor="end" fill="#ddd6fe" font-size="24" font-weight="800">12</text>
      <rect x="0" y="25" width="652" height="28" rx="14" fill="#0b1728" stroke="#1e3a5f"/><rect x="0" y="25" width="130" height="28" rx="14" fill="url(#barC)"><animate attributeName="width" from="0" to="130" dur="0.58s" begin="0.16s" fill="freeze"/></rect>
    </g>
    <text x="34" y="570" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.5">CLIENT DELIVERY LIFECYCLE</text>
    <g transform="translate(34 592)">
      <rect width="652" height="252" rx="18" fill="#0b1728" stroke="#2dd4bf" stroke-opacity="0.38"/>
      <g fill="#e2e8f0" font-size="19" font-weight="650"><text x="28" y="43">01  Requirements gathering</text><text x="28" y="88">02  Solution walkthrough &amp; demo</text><text x="28" y="133">03  Build, configuration &amp; QA</text><text x="28" y="178">04  Production launch</text><text x="28" y="223">05  Training &amp; handover</text></g>
      <g fill="#2dd4bf" font-size="17"><text x="610" y="43">✓</text><text x="610" y="88">✓</text><text x="610" y="133">✓</text><text x="610" y="178">✓</text><text x="610" y="223">✓</text></g>
    </g>
    <text x="34" y="875" fill="#64748b" font-size="13">Counts reflect production and client-facing delivery experience.</text>
  </g>
</svg>