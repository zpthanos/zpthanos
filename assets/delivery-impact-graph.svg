<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Delivery impact graph</title>
  <desc id="description">A four-stage delivery flow from clarify to coordinate to verify to enable, supported by evidence from 60 plus live sites, 30 client engagements, a 2,000 plus product catalogue, and 3 plus years of client-facing technical delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#334155"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="54" y="64" fill="#f8fafc" font-size="28" font-weight="800">Partner delivery, from ambiguity to verified outcome</text>
    <text x="54" y="94" fill="#94a3b8" font-size="16">A production-focused workflow backed by measurable operating experience</text>

    <path d="M150 224 C280 150, 365 150, 470 224 S660 298, 760 224 S950 150, 1060 224" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>

    <g filter="url(#shadow)">
      <g transform="translate(70 154)">
        <rect width="220" height="142" rx="18" fill="#0b1728" stroke="#1e3a5f" stroke-width="1.5"/>
        <circle cx="34" cy="34" r="14" fill="#38bdf8"/>
        <text x="34" y="39" text-anchor="middle" fill="#07111f" font-size="14" font-weight="900">1</text>
        <text x="58" y="40" fill="#f8fafc" font-size="21" font-weight="800">CLARIFY</text>
        <text x="24" y="78" fill="#cbd5e1" font-size="14">Business need</text>
        <text x="24" y="101" fill="#cbd5e1" font-size="14">Expected behaviour</text>
        <text x="24" y="124" fill="#cbd5e1" font-size="14">Priority and risk</text>
      </g>

      <g transform="translate(360 154)">
        <rect width="220" height="142" rx="18" fill="#0b1728" stroke="#164e63" stroke-width="1.5"/>
        <circle cx="34" cy="34" r="14" fill="#22d3ee"/>
        <text x="34" y="39" text-anchor="middle" fill="#07111f" font-size="14" font-weight="900">2</text>
        <text x="58" y="40" fill="#f8fafc" font-size="21" font-weight="800">COORDINATE</text>
        <text x="24" y="78" fill="#cbd5e1" font-size="14">Owners and timeline</text>
        <text x="24" y="101" fill="#cbd5e1" font-size="14">Dependencies</text>
        <text x="24" y="124" fill="#cbd5e1" font-size="14">Rollback path</text>
      </g>

      <g transform="translate(650 154)">
        <rect width="220" height="142" rx="18" fill="#0b1728" stroke="#0f766e" stroke-width="1.5"/>
        <circle cx="34" cy="34" r="14" fill="#2dd4bf"/>
        <text x="34" y="39" text-anchor="middle" fill="#07111f" font-size="14" font-weight="900">3</text>
        <text x="58" y="40" fill="#f8fafc" font-size="21" font-weight="800">VERIFY</text>
        <text x="24" y="78" fill="#cbd5e1" font-size="14">Functional checks</text>
        <text x="24" y="101" fill="#cbd5e1" font-size="14">Regression evidence</text>
        <text x="24" y="124" fill="#cbd5e1" font-size="14">Release health</text>
      </g>

      <g transform="translate(940 154)">
        <rect width="220" height="142" rx="18" fill="#0b1728" stroke="#4c1d95" stroke-width="1.5"/>
        <circle cx="34" cy="34" r="14" fill="#a78bfa"/>
        <text x="34" y="39" text-anchor="middle" fill="#07111f" font-size="14" font-weight="900">4</text>
        <text x="58" y="40" fill="#f8fafc" font-size="21" font-weight="800">ENABLE</text>
        <text x="24" y="78" fill="#cbd5e1" font-size="14">Documentation</text>
        <text x="24" y="101" fill="#cbd5e1" font-size="14">User training</text>
        <text x="24" y="124" fill="#cbd5e1" font-size="14">Ongoing support</text>
      </g>
    </g>

    <g transform="translate(54 350)">
      <rect width="260" height="118" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
      <text x="22" y="47" fill="#f8fafc" font-size="34" font-weight="900">60+</text>
      <text x="22" y="76" fill="#7dd3fc" font-size="13" font-weight="800" letter-spacing="1.2">LIVE SITES &amp; APPS</text>
      <text x="22" y="99" fill="#94a3b8" font-size="13">Support, QA, launches and recovery</text>
    </g>

    <g transform="translate(332 350)">
      <rect width="260" height="118" rx="16" fill="#0b1728" stroke="#164e63"/>
      <text x="22" y="47" fill="#f8fafc" font-size="34" font-weight="900">30</text>
      <text x="22" y="76" fill="#67e8f9" font-size="13" font-weight="800" letter-spacing="1.2">CLIENT ENGAGEMENTS</text>
      <text x="22" y="99" fill="#94a3b8" font-size="13">Requirements through post-launch support</text>
    </g>

    <g transform="translate(610 350)">
      <rect width="260" height="118" rx="16" fill="#0b1728" stroke="#0f766e"/>
      <text x="22" y="47" fill="#f8fafc" font-size="34" font-weight="900">2,000+</text>
      <text x="22" y="76" fill="#5eead4" font-size="13" font-weight="800" letter-spacing="1.2">PRODUCT CATALOGUE</text>
      <text x="22" y="99" fill="#94a3b8" font-size="13">WooCommerce operations and handover</text>
    </g>

    <g transform="translate(888 350)">
      <rect width="260" height="118" rx="16" fill="#0b1728" stroke="#4c1d95"/>
      <text x="22" y="47" fill="#f8fafc" font-size="34" font-weight="900">3+ years</text>
      <text x="22" y="76" fill="#c4b5fd" font-size="13" font-weight="800" letter-spacing="1.2">CLIENT-FACING DELIVERY</text>
      <text x="22" y="99" fill="#94a3b8" font-size="13">Customers, developers and providers</text>
    </g>
  </g>
</svg>