<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Customer story finder for relationship recovery, ambiguous requests and proactive account value">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="1184" height="284" rx="24" fill="url(#bg)" stroke="#1E3A5F" stroke-width="2"/>
  <rect x="34" y="28" width="184" height="34" rx="17" fill="#20B8A6"/>
  <text x="126" y="51" text-anchor="middle" fill="#031711" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">CUSTOMER STORIES</text>

  <text x="34" y="103" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Start with the customer situation. Inspect the real case.</text>
  <text x="34" y="131" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="15">21 first-hand production stories across relationships, delivery, support, QA and account value.</text>

  <rect x="34" y="157" width="350" height="94" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="54" y="184" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">CUSTOMER IS UNHAPPY</text>
  <text x="54" y="211" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Recover trust and reset expectations</text>
  <text x="54" y="235" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">Listen · clarify · coordinate · validate</text>

  <rect x="425" y="157" width="350" height="94" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="445" y="184" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">REQUEST IS VAGUE</text>
  <text x="445" y="211" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Turn ambiguity into requirements</text>
  <text x="445" y="235" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">Discover · research · recommend · review</text>

  <rect x="816" y="157" width="350" height="94" rx="12" fill="#0B1728" stroke="#1E3A5F"/>
  <text x="836" y="184" fill="#20B8A6" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">VALUE OPPORTUNITY</text>
  <text x="836" y="211" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Go beyond the original brief</text>
  <text x="836" y="235" fill="#AFC0CD" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">Identify need · propose value · deliver · verify</text>

  <line x1="34" y1="268" x2="1166" y2="268" stroke="#1E3A5F"/>
  <text x="34" y="286" fill="#2F8FBE" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".8">PICK A SITUATION → SEE THE STRONGEST FIRST-HAND EVIDENCE</text>
</svg>
