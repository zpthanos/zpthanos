name: Apply section visual polish

on:
  push:
    paths:
      - .github/workflows/apply-section-visual-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write redesigned profile files
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, tarfile
          payload = """"""
          data = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              archive.extractall(".")
          PY
      - name: Commit redesigned sections
        shell: bash
        run: |
          git config user.name "Athanasios (Thanos) Zaprios"
          git config user.email "153440089+zpthanos@users.noreply.github.com"
          git add README.md assets/customer-success-fit-v2.svg assets/customer-success-fit-mobile-v2.svg assets/recruiter-evidence-v2.svg assets/recruiter-evidence-mobile-v2.svg assets/open-source-readiness-v2.svg assets/open-source-readiness-mobile-v2.svg assets/supporting-evidence-index-v2.svg assets/supporting-evidence-index-mobile-v2.svg
          git commit -m "Polish evidence sections and tighten profile spacing"
          git push
