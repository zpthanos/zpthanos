name: Apply profile visual redesign

on:
  push:
    paths:
      - '.github/workflows/apply-profile-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install redesigned profile files
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/profile-redesign.tar.gz
          tar -xzf /tmp/profile-redesign.tar.gz -C .

      - name: Validate profile files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path('README.md')
          content = readme.read_text(encoding='utf-8')
          if ';' in content:
              raise SystemExit('README contains a semicolon')

          refs = sorted(set(re.findall(r'\./assets/([^\"\)]+)', content)))
          missing = [ref for ref in refs if not (Path('assets') / ref).exists()]
          if missing:
              raise SystemExit(f'Missing assets: {missing}')

          required = [
              'CUSTOMER_SUCCESS_REVIEW.md',
              'OPEN_SOURCE_CUSTOMER_SUCCESS_LAB.md',
          ]
          missing_required = [path for path in required if not Path(path).exists()]
          if missing_required:
              raise SystemExit(f'Missing required files: {missing_required}')

          print(f'Validated {len(refs)} profile asset references')
          PY

      - name: Commit redesigned profile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets
          if git diff --cached --quiet; then
            echo 'No profile changes to commit'
            exit 0
          fi
          git commit -m 'Complete visual profile redesign'
          git push
